<script>
// Setiap 30 detik nyata = 1 "jam" simulasi, biar tarif progresif kelihatan tanpa nunggu lama
const DEMO_SEC_PER_HOUR = 30;
// QR keluar hanya berlaku 3 menit setelah pembayaran (ubah ke 20 kalau mau tes cepat)
const EXIT_GRACE_SEC = 180;

const SPLASH_MS = 3000;   // lama logo pembuka (3 detik, termasuk memudar keluar)
const APP_VERSION = 'v4';

// Penyimpanan lokal di perangkat ini (akun & preferensi), aman kalau storage diblokir
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let appState = {
  currentScreen: 'screen-1',
  userEmail: '', accountHash: '', authError: '', draftEmail: '', vehicleError: '',
  payMethod: null, payProvider: '', draftMethod: null, draftProvider: '', lastMethod: '',
  vehiclePlate: '',
  vehicleType: 'Mobil',
  parkingType: null,        // GRATIS_AWAL atau FLAT, diisi otomatis dari hasil scan QR
  parkingLocationName: '',
  parkingLocationAddress: '',
  freeMinutesLimit: 0,
  tarif: null,              // { Motor:{awal,perJam} | angka, Mobil:{...}, Bus:{...} }
  parkingStatus: 'BELUM_PARKIR',
  parkingStartTime: null,
  parkingDurationSec: 0,
  parkingDurationStr: '00:00:00',
  parkingCost: 0,
  timerInterval: null,
  transactions: [],
  scanning: false,
  scanError: '',
  previewSrc: '',
  autoPayStage: 'idle', // idle | processing | success
  payKind: 'MAIN',      // MAIN | EXTRA
  paidAt: null, lastPaid: 0, qrSvg: '', exitCountdownSec: 0,
  extraCost: 0, extraDurationStr: '00:00:00',
  gateInterval: null, gateMsg: '', gateOk: false
};

setInterval(() => {
  document.getElementById('current-time').innerText = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}, 1000);

function fmtRp(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

function render() {
  const container = document.getElementById('app-content');
  const nav = document.getElementById('bottom-nav');
  if (['screen-4','screen-5','screen-6'].includes(appState.currentScreen)) { nav.classList.remove('hidden'); updateNavHighlight(); }
  else { nav.classList.add('hidden'); }
  const fns = { 'screen-1': renderScreen1, 'screen-2': renderScreen2, 'screen-3': renderScreen3, 'screen-4': renderScreen4, 'screen-5': renderScreen5, 'screen-6': renderScreen6, 'screen-7': renderScreen7 };
  container.innerHTML = fns[appState.currentScreen]();
  if (appState.currentScreen === 'screen-5' && appState.parkingStatus === 'BELUM_PARKIR' && appState.scanning) startCameraScan();
}

function updateNavHighlight() {
  ['nav-status','nav-scan','nav-history'].forEach(id => document.getElementById(id).className = "flex flex-col items-center gap-0.5 text-gray-400");
  const map = { 'screen-4':'nav-status', 'screen-5':'nav-scan', 'screen-6':'nav-history' };
  const el = document.getElementById(map[appState.currentScreen]);
  if (el) el.className = "flex flex-col items-center gap-0.5 text-blue-600 font-bold";
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Tahap 1: akun baru (email + password), hanya tampil kalau perangkat ini belum punya akun
function renderScreen1() {
  return `<div class="p-6 flex flex-col justify-between h-full min-h-[580px]">
    <div class="text-center my-5">
      <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-3"><i class="fa-solid fa-square-parking"></i></div>
      <h2 class="text-2xl font-black text-gray-900">PARKIRIN</h2>
      <p class="text-xs text-gray-500 mt-1">Buat akun atau masuk dengan email &amp; password</p>
    </div>
    <div class="space-y-3">
      <input id="input-email" type="email" value="${esc(appState.draftEmail)}" placeholder="Email" autocomplete="email" class="w-full bg-white border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="input-pass" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()" class="w-full bg-white border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      ${appState.authError ? `<p class="text-[11px] text-red-500 text-center">${appState.authError}</p>` : ''}
      <button onclick="doRegister()" class="w-full bg-blue-600 text-white font-semibold py-3.5 rounded-xl shadow-lg text-sm">Masuk / Daftar</button>
      <p class="text-[10px] text-gray-400 text-center">Akun tersimpan di perangkat ini. Lain kali cukup masukkan password.</p>
    </div>
    <div class="text-center text-xs text-gray-400">Langkah 1 dari 6 • Akun • ${APP_VERSION}</div>
  </div>`;
}

// Tahap 2: perangkat yang sama, cukup password
function renderScreen2() {

async function hashPw(email, pw) {
  const data = new TextEncoder().encode(email.toLowerCase() + '|' + pw);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const b of data) h = (h * 31 + b) | 0; return 'x' + h;
}
function authFail(msg) { appState.authError = msg; render(); }
async function doRegister() {
  const email = document.getElementById('input-email').value.trim();
  const pw = document.getElementById('input-pass').value;
  appState.draftEmail = email;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return authFail('Format email belum benar.');
  if (pw.length < 6) return authFail('Password minimal 6 karakter.');
  const hash = await hashPw(email, pw);
  store.set('parkirin_account', { email, hash });
  appState.userEmail = email; appState.accountHash = hash; appState.authError = '';
  appState.currentScreen = 'screen-3'; render();
}
async function doLogin() {
  const pw = document.getElementById('input-login-pass').value;
  const hash = await hashPw(appState.userEmail, pw);
  if (hash === appState.accountHash) { appState.authError = ''; appState.currentScreen = 'screen-3'; render(); }
  else authFail('Password salah, coba lagi.');
}
function switchAccount() {
  store.del('parkirin_account'); store.del('parkirin_prefs');
  Object.assign(appState, { userEmail: '', accountHash: '', draftEmail: '', authError: '', vehiclePlate: '', payMethod: null, payProvider: '', currentScreen: 'screen-1' });
  render();
}

function fmtDur(sec) { return [Math.floor(sec/3600), Math.floor((sec%3600)/60), sec%60].map(n=>String(n).padStart(2,'0')).join(':'); }
function fmtMS(sec) { return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function fmtJam(d) { return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB'; }

}

// --- Scan Pintar: baca QR (kamera atau upload gambar), otomatis kenali skema tarif ---
let cameraStream = null, cameraStarting = false, scanLoopOn = false, lastScanAt = 0;
function cameraFail(err) {
  const name = err && err.name, inFrame = window.self !== window.top;
  let msg;
  if (!window.isSecureContext) msg = 'Kamera hanya bisa dipakai lewat alamat HTTPS. Buka aplikasi lewat https:// atau pakai tombol "Ambil Foto QR".';
  else if (name === 'NotAllowedError' || name === 'SecurityError') msg = inFrame
    ? 'Kamera live diblokir karena aplikasi dibuka di dalam halaman lain (frame). Pakai tombol "Ambil Foto QR" di bawah, atau buka aplikasi dari alamat hosting sendiri.'
    : 'Izin kamera ditolak. Izinkan kamera untuk situs ini (ikon gembok di address bar → Izin → Kamera), lalu tekan Aktifkan Kamera lagi.';
  else if (name === 'NotFoundError' || name === 'OverconstrainedError') msg = 'Kamera tidak ditemukan di perangkat ini. Pakai "Ambil Foto QR" atau upload gambar.';
  else if (name === 'NotReadableError') msg = 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi itu lalu coba lagi.';
  else msg = 'Kamera tidak bisa dibuka' + (name ? ' (' + name + ')' : '') + '. Coba "Ambil Foto QR".';
  appState.scanning = false; appState.scanError = msg; render();
}
function attachCamera() {
  const v = document.getElementById('scan-video');
  if (v && cameraStream && v.srcObject !== cameraStream) { v.srcObject = cameraStream; v.play().catch(() => {}); }
}
function startCameraScan() {
  if (cameraStream) { attachCamera(); return; }   // render ulang tidak membuka kamera dua kali
  if (cameraStarting) return;
  appState.scanError = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraFail({ name: 'NotSupported' }); return; }
  cameraStarting = true;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(stream => {
      cameraStarting = false;
      if (!appState.scanning) { stream.getTracks().forEach(t => t.stop()); return; }
      cameraStream = stream; attachCamera();
      if (!scanLoopOn) { scanLoopOn = true; requestAnimationFrame(scanTick); }
    })
    .catch(err => { cameraStarting = false; cameraFail(err); });
}
function stopCameraScan() {
  appState.scanning = false;
  if (cameraStream) { cameraStream.getTracks().forEach(tr => tr.stop()); cameraStream = null; }
}
function scanTick(ts) {
  if (!appState.scanning || !cameraStream) { scanLoopOn = false; return; }
  const video = document.getElementById('scan-video');
  if (video && video.readyState >= 2 && video.videoWidth && ts - lastScanAt > 120) {
    lastScanAt = ts;
    const canvas = document.getElementById('scan-canvas');
    const scale = Math.min(1, 800 / video.videoWidth);   // perkecil biar ringan di HP
    canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data) { scanLoopOn = false; stopCameraScan(); handleScanData(code.data); return; }
  }
  requestAnimationFrame(scanTick);
}
function decodeImageFile(file) {
  if (!file) return;
  appState.scanError = '';
  const reader = new FileReader();
  reader.onerror = () => { appState.scanError = 'Gagal membaca file gambar. Coba file lain.'; render(); };
  reader.onload = (e) => {
    appState.previewSrc = e.target.result; // data: URL, tidak tergantung blob/CSP
    const img = new Image();
    img.onerror = () => { appState.scanError = 'File ini bukan gambar yang valid.'; render(); };
    img.onload = () => {
      const canvas = document.getElementById('scan-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      let code = null;
      for (const maxSide of [1600, 1000, 640]) {   // coba beberapa ukuran supaya QR di foto besar tetap terbaca
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
        if (code) break;
      }
      if (code) { handleScanData(code.data); }
      else { appState.scanError = 'QR tidak terbaca dari gambar itu. Pastikan QR terlihat jelas, tidak buram/gelap, lalu coba lagi.'; render(); }
    };
    img.src = appState.previewSrc;
  };
  reader.readAsDataURL(file);
  render(); // langsung tampilkan status sementara proses berjalan
}
function handleScanData(raw) {
  let d;
  try { d = JSON.parse(raw); } catch (e) { appState.scanError = 'QR ini bukan QR parkir PARKIRIN.'; render(); return; }
  if (!d.type || !d.tarif) { appState.scanError = 'Data QR tidak valid.'; render(); return; }
  stopGateTimer(); appState.gateMsg = '';
  appState.parkingType = d.type;
  appState.parkingLocationName = d.loc || 'Lokasi Parkir';
  appState.parkingLocationAddress = d.addr || '-';
  appState.freeMinutesLimit = d.freeMin || 0;
  appState.tarif = d.tarif;
  appState.parkingStatus = 'PARKIR_AKTIF';
  appState.parkingStartTime = new Date();
  appState.parkingDurationSec = 0;
  appState.parkingCost = d.type === 'FLAT' ? (d.tarif[appState.vehicleType] || 0) : 0;
  if (appState.timerInterval) clearInterval(appState.timerInterval);
  appState.timerInterval = setInterval(updateParkingTimer, 1000);
  appState.currentScreen = 'screen-4';
  render();
}

function updateParkingTimer() {
  if (!appState.parkingStartTime || appState.parkingStatus !== 'PARKIR_AKTIF') return;
  const sec = Math.floor((new Date() - appState.parkingStartTime) / 1000);
  appState.parkingDurationSec = sec;
  appState.parkingDurationStr = [Math.floor(sec/3600), Math.floor((sec%3600)/60), sec%60].map(n=>String(n).padStart(2,'0')).join(':');
  if (appState.parkingType === 'GRATIS_AWAL') {
    const t = appState.tarif[appState.vehicleType];
    if (sec <= appState.freeMinutesLimit * 60) { appState.parkingCost = 0; }
    else {
      const extraSec = sec - appState.freeMinutesLimit * 60;
      const extraHours = Math.floor(extraSec / DEMO_SEC_PER_HOUR) + 1; // jam pertama setelah gratis langsung kena
      appState.parkingCost = t.awal + (extraHours - 1) * t.perJam;
    }
  }
  if (appState.currentScreen === 'screen-4' || appState.currentScreen === 'screen-5') render();
}

function calcExtra(sec) {
  const t = appState.tarif[appState.vehicleType];
  if (appState.parkingType === 'FLAT') return t;                       // skema flat: kena tarif flat lagi
  return Math.max(1, Math.ceil(sec / DEMO_SEC_PER_HOUR)) * t.perJam;   // skema gratis-awal: tarif per jam (skala demo)
}

function makeQrSvg(text) {
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    const n = qr.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) d += `M${k+2} ${r+2}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+4} ${n+4}" class="w-full h-full" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  } catch (e) { return ''; }
}

function startGateTimer() { stopGateTimer(); appState.gateInterval = setInterval(gateTick, 1000); gateTick(); }
function stopGateTimer() { if (appState.gateInterval) { clearInterval(appState.gateInterval); appState.gateInterval = null; } }
function gateTick() {
  if (!appState.paidAt) return;
  const el = Math.floor((Date.now() - appState.paidAt.getTime()) / 1000);
  if (appState.parkingStatus === 'SUDAH_BAYAR') {
    appState.exitCountdownSec = Math.max(0, EXIT_GRACE_SEC - el);
    if (el >= EXIT_GRACE_SEC) appState.parkingStatus = 'QR_KADALUARSA';
  }
  if (appState.parkingStatus === 'QR_KADALUARSA') {
    appState.extraCost = calcExtra(el);
    appState.extraDurationStr = fmtDur(el);
  }
  if (appState.currentScreen === 'screen-4') render();
}

// Simulasi scan QR keluar di gerbang
function gateScan() {
  gateTick(); // pastikan status terbaru
  if (appState.parkingStatus === 'SUDAH_BAYAR') {
    stopGateTimer();
    resetParking();
    appState.gateMsg = '✅ QR valid — palang terbuka. Terima kasih & hati-hati di jalan!'; appState.gateOk = true;
    render();
  } else {
    appState.gateMsg = '❌ QR tidak terdeteksi: sudah lewat 3 menit sejak pembayaran. Bayar biaya tambahan dulu.'; appState.gateOk = false;
    render();
  }
}

function runAutoPay() {
  appState.gateMsg = '';
  appState.autoPayStage = 'processing';
  navigateTo('scan'); // pindah ke screen-5, langsung render tampilan "processing"
  setTimeout(() => {
    appState.autoPayStage = 'success';
    render();
    setTimeout(finalizePayment, 1400);
  }, 1300);
}

function startAutoPayout() {
  // Bekukan durasi & biaya saat ini juga - kayak titik saat kendaraan sampai di gate
  if (appState.timerInterval) { clearInterval(appState.timerInterval); appState.timerInterval = null; }
  appState.payKind = 'MAIN';
  appState.gateMsg = '';
  if (appState.parkingCost === 0) finalizePayment(); // masih masa gratis: tidak perlu bayar
  else openPayChoice();                              // pilih metode bayar di akhir (saat keluar gate)
}

function startExtraPayout() {
  stopGateTimer();
  const sec = Math.floor((Date.now() - appState.paidAt.getTime()) / 1000);
  appState.parkingCost = calcExtra(sec);      // biaya tambahan dibekukan di titik ini
  appState.parkingDurationStr = fmtDur(sec);  // durasi sejak pembayaran terakhir
  appState.payKind = 'EXTRA';
  openPayChoice();
}

function finalizePayment() {
  const extra = appState.payKind === 'EXTRA';
  const now = new Date();
  appState.transactions.unshift({
    location: appState.parkingLocationName, address: appState.parkingLocationAddress,
    plate: appState.vehiclePlate, vehicleType: appState.vehicleType,
    jamMasuk: fmtJam(extra ? appState.paidAt : appState.parkingStartTime), jamKeluar: fmtJam(now),
    duration: appState.parkingDurationStr, amount: appState.parkingCost,
    method: appState.parkingCost === 0 ? 'Gratis' : payLabel(), status: extra ? 'Biaya Tambahan' : 'Berhasil'
  });
  // Pembayaran sukses -> QR keluar baru, berlaku 3 menit
  appState.paidAt = now;
  appState.lastPaid = appState.parkingCost; appState.lastMethod = appState.parkingCost === 0 ? 'Gratis' : payLabel();
  appState.qrSvg = makeQrSvg(JSON.stringify({ k: 'EXIT', p: appState.vehiclePlate, t: now.getTime(), v: EXIT_GRACE_SEC }));
  appState.parkingStatus = 'SUDAH_BAYAR';
  appState.autoPayStage = 'idle'; appState.payKind = 'MAIN';
  appState.currentScreen = 'screen-4';
  startGateTimer();
  render();
}

function resetParking() {
  stopGateTimer();
  appState.parkingStatus = 'BELUM_PARKIR';
  appState.parkingType = null; appState.tarif = null; appState.scanError = ''; appState.autoPayStage = 'idle';
  appState.paidAt = null; appState.qrSvg = ''; appState.gateMsg = '';
  appState.extraCost = 0; appState.extraDurationStr = '00:00:00';
  appState.parkingDurationStr = '00:00:00'; appState.parkingDurationSec = 0; appState.parkingCost = 0;
  appState.currentScreen = 'screen-4';
  render();
}

let splashTimer = null, splashFade = null, hiddenAt = 0, skipSplashUntil = 0;
function showSplash() {
  const o = document.getElementById('splash-overlay'), img = document.getElementById('splash-img');
  if (!img.getAttribute('src')) img.src = SPLASH_IMG;
  clearTimeout(splashTimer); clearTimeout(splashFade);
  o.style.transition = 'none'; o.style.opacity = '1'; o.style.display = 'flex';
  img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';   // putar ulang animasi masuk
  splashTimer = setTimeout(() => {   // memudar 0,3 detik di akhir, total tepat SPLASH_MS
    o.style.transition = 'opacity .3s'; o.style.opacity = '0';
    splashFade = setTimeout(() => { o.style.display = 'none'; }, 320);
  }, SPLASH_MS - 300);
}
// Saat memilih foto / membuka kamera HP, browser sempat keluar dari aplikasi: jangan tampilkan logo saat kembali
function skipSplashOnce() { skipSplashUntil = Date.now() + 120000; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt >= 2000 && Date.now() > skipSplashUntil) showSplash();   // aplikasi dibuka lagi dari latar belakang
  hiddenAt = 0;
});
window.addEventListener('pageshow', e => { if (e.persisted) showSplash(); });   // halaman dipulihkan dari cache browser

(function init() {
  const acct = store.get('parkirin_account'), prefs = store.get('parkirin_prefs') || {};
  if (prefs.plate) appState.vehiclePlate = prefs.plate;
  if (prefs.type) appState.vehicleType = prefs.type;
  if (prefs.payMethod) { appState.payMethod = prefs.payMethod; appState.payProvider = prefs.payProvider || ''; }
  if (acct && acct.email && acct.hash) { appState.userEmail = acct.email; appState.accountHash = acct.hash; appState.currentScreen = 'screen-2'; }
  else appState.currentScreen = 'screen-1';
  showSplash();   // logo PARKIRIN 3 detik setiap aplikasi dibuka
})();
render();
</script>
